name: bbb_meeting_sdk
description: >-
  BigBlueButton meeting SDK for Flutter. Pass a join URL, the meeting opens full-screen in the
  native SDK, and you get the leave reason back.
version: 0.1.0
homepage: https://biggerbluebutton.com/
repository: https://github.com/ahmad-bbbb/bigbluebutton-mobile-sdk/tree/main/flutter/bbb_meeting_sdk
issue_tracker: https://github.com/ahmad-bbbb/bigbluebutton-mobile-sdk/issues
topics:
  - bigbluebutton
  - video-conferencing
  - webrtc
  - meeting

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.bigbluebutton.bbb.flutter
        pluginClass: BbbMeetingSdkPlugin
      ios:
        pluginClass: BbbMeetingSdkPlugin
